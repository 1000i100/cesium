          <script src="../cesium-desktop.js"></script>|' "${APP_NW}/cesium/index.html"

      # Install desktop node dependencies
      cd "${APP_NW}"
      npm install --production 2>/dev/null || true
      cd "${WORK_DIR}"

      # Copy app icon
      ICON_SRC="${CI_PROJECT_DIR}/dist/desktop/arch/osx/package/Contents/Resources/app.icns"
      if [ -f "${ICON_SRC}" ]; then
        cp "${ICON_SRC}" "${APP_BUNDLE}/Contents/Resources/app.icns"
      fi

      # Rename to Cesium.app
      CESIUM_APP="${WORK_DIR}/${NWJS_DIR}/Cesium.app"
      mv "${APP_BUNDLE}" "${CESIUM_APP}"

      echo "=== Creating .zip ==="
      cd "${WORK_DIR}/${NWJS_DIR}"
      ZIP_FILE="${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-macos-x86_64.zip"
      zip -qr "${CI_PROJECT_DIR}/${BUILD_DIR}/${ZIP_FILE}" "Cesium.app"
      echo "Created: ${ZIP_FILE}"

      echo "=== Generating SHA256 checksums ==="
      cd "${CI_PROJECT_DIR}/${BUILD_DIR}"
      for f in *; do
        case "$f" in *.sha256) continue ;; esac
        [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
      done

      echo "=== Build complete ==="
      ls -la "${CI_PROJECT_DIR}/${BUILD_DIR}/"
  artifacts:
    paths:
      - dist/desktop/build/
    expire_in: 2 hours

