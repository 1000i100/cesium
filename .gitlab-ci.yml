  script:
    - |
      set -e
      NWJS_DIR="nwjs-v${NWJS_VERSION}-osx-x64"
      BUILD_DIR="dist/desktop/build"
      WORK_DIR="$(pwd)/desktop-work"
      mkdir -p "${BUILD_DIR}" "${WORK_DIR}"

