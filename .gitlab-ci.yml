      cd "${WORK_DIR}"
      curl -sLO "https://dl.nwjs.io/v${NWJS_VERSION}/${NWJS_DIR}.zip"
      unzip -q "${NWJS_DIR}.zip"

      echo "=== Preparing macOS application ==="
      APP_BUNDLE="${WORK_DIR}/${NWJS_DIR}/nwjs.app"
      APP_NW="${APP_BUNDLE}/Contents/Resources/app.nw"
      mkdir -p "${APP_NW}"

      # Copy web files
