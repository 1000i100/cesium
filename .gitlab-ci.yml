    - git config --global url."https://git.duniter.org/".insteadOf "git@git.duniter.org:"
    - git submodule init || true
    - git submodule sync || true
    # Clean submodule dirs (gitlink from checkout blocks clone)
    - rm -rf dist/desktop dist/android/sources
    - git submodule update --remote --merge || true
    - CURRENT_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
