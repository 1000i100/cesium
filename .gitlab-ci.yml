# ---------------------------------------------------------------
# Stage: publish
# ---------------------------------------------------------------

publish:sign:extFirefox:
  stage: publish
  image: node:20
  needs:
    - job: build:extFirefox
      artifacts: true
  before_script:
    - npm install -g web-ext
  script:
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')

      echo "Signing Firefox extension v${TAG_VERSION} via AMO..."
      web-ext sign \
        --upload-source-code \
        --api-key="${AMO_JWT_ISSUER}" \
        --api-secret="${AMO_JWT_SECRET}" \
        --source-dir=dist/web/ext \
        --artifacts-dir=dist/web/build \
        --channel=unlisted || true

      # Rename output XPI to standard name
      XPI_FILE=$(find dist/web/build -name "*.xpi" | head -1)
      if [ -n "${XPI_FILE}" ]; then
        mv "${XPI_FILE}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi"
        echo "Signed XPI: ${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi"
      else
        echo "WARN: No XPI produced by web-ext sign, falling back to unsigned zip"
        EXT_ZIP=$(find dist/web/build -name "${PROJECT_NAME}-v*-extension.zip" -not -name "*-chrome*" 2>/dev/null | head -1)
        if [ -n "${EXT_ZIP}" ]; then
          cp "${EXT_ZIP}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi"
          echo "Created unsigned XPI from extension zip"
        fi
      fi
  artifacts:
    paths:
      - dist/web/build/
    expire_in: 2 hours
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG && $AMO_JWT_ISSUER && $AMO_JWT_SECRET

publish:sign:extChrome:
  stage: publish
  image: node:20
  needs:
    - job: build:extChrome
      artifacts: true
  before_script:
    - npm install -g chrome-webstore-upload-cli
  script:
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      # Gulp uses package.json version, not tag — find by pattern
      CHROME_ZIP=$(find dist/web/build -name "${PROJECT_NAME}-v*-extension-chrome.zip" 2>/dev/null | head -1)

      if [ -z "${CHROME_ZIP}" ]; then
        echo "ERROR: Chrome extension zip not found in dist/web/build/"
        ls -la dist/web/build/ 2>/dev/null
        exit 1
      fi

      echo "Uploading Chrome extension v${TAG_VERSION} to Chrome Web Store..."
      chrome-webstore-upload upload \
        --source "${CHROME_ZIP}" \
        --extension-id "${CWS_EXTENSION_ID}" \
        --client-id "${CWS_CLIENT_ID}" \
        --client-secret "${CWS_CLIENT_SECRET}" \
        --refresh-token "${CWS_REFRESH_TOKEN}"

      echo "Publishing Chrome extension..."
      chrome-webstore-upload publish \
        --extension-id "${CWS_EXTENSION_ID}" \
        --client-id "${CWS_CLIENT_ID}" \
        --client-secret "${CWS_CLIENT_SECRET}" \
        --refresh-token "${CWS_REFRESH_TOKEN}" || echo "WARN: Publish may require manual review"

      # Mark as published
      cp "${CHROME_ZIP}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-chrome-PUBLISHED.zip"
      echo "Chrome extension uploaded and publish requested"
  artifacts:
    paths:
      - dist/web/build/
    expire_in: 2 hours
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG && $CWS_CLIENT_ID && $CWS_CLIENT_SECRET && $CWS_REFRESH_TOKEN && $CWS_EXTENSION_ID

# Edge Add-ons API: access token expires every 72 days
# Renew via: https://partner.microsoft.com/en-us/dashboard/microsoftedge/publishapi
publish:sign:extEdge:
  stage: publish
  image: node:20
  needs:
    - job: build:extChrome
      artifacts: true
  script:
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      # Gulp uses package.json version, not tag — find by pattern
      CHROME_ZIP=$(find dist/web/build -name "${PROJECT_NAME}-v*-extension-chrome.zip" 2>/dev/null | head -1)

      if [ -z "${CHROME_ZIP}" ]; then
        echo "ERROR: Chrome extension zip not found (used as Edge source)"
        ls -la dist/web/build/ 2>/dev/null
        exit 1
      fi

      echo "=== Obtaining Edge API access token ==="
      TOKEN_RESPONSE=$(curl -s -X POST \
        "https://login.microsoftonline.com/consumers/oauth2/v2.0/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "client_id=${EDGE_CLIENT_ID}&scope=https://api.addons.microsoftedge.microsoft.com/.default&client_secret=${EDGE_API_KEY}&grant_type=client_credentials")

      ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
      if [ -z "${ACCESS_TOKEN}" ]; then
        echo "ERROR: Failed to obtain Edge API access token"
        echo "Response: ${TOKEN_RESPONSE}"
        echo "NOTE: Edge API key expires every 72 days. Check if renewal is needed."
        exit 1
      fi

      EDGE_API="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions"

      echo "=== Uploading package to Edge Add-ons ==="
      UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
        "${EDGE_API}/draft/package" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/zip" \
        --data-binary "@${CHROME_ZIP}")

      HTTP_CODE=$(echo "${UPLOAD_RESPONSE}" | tail -1)
      BODY=$(echo "${UPLOAD_RESPONSE}" | head -n -1)

      if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
        echo "ERROR: Upload failed (HTTP ${HTTP_CODE})"
        echo "${BODY}"
        exit 1
      fi

      OPERATION_ID=$(echo "${BODY}" | grep -o '"operationId":"[^"]*"' | cut -d'"' -f4)
      echo "Upload started, operation: ${OPERATION_ID}"

      # Poll upload status (max 5 minutes)
      for i in $(seq 1 30); do
        sleep 10
        STATUS_RESPONSE=$(curl -s \
          "${EDGE_API}/draft/package/operations/${OPERATION_ID}" \
          -H "Authorization: Bearer ${ACCESS_TOKEN}")
        STATUS=$(echo "${STATUS_RESPONSE}" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
        echo "Upload status: ${STATUS} (attempt ${i}/30)"
        if [ "${STATUS}" = "Succeeded" ]; then
          break
        elif [ "${STATUS}" = "Failed" ]; then
          echo "ERROR: Upload processing failed"
          echo "${STATUS_RESPONSE}"
          exit 1
        fi
      done

      echo "=== Publishing Edge extension ==="
      PUBLISH_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
        "${EDGE_API}" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{}')

      HTTP_CODE=$(echo "${PUBLISH_RESPONSE}" | tail -1)
      if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
        echo "Edge extension publish requested successfully"
      else
        echo "WARN: Publish request returned HTTP ${HTTP_CODE} (may require manual review)"
      fi

      # Mark as published
      cp "${CHROME_ZIP}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-edge-PUBLISHED.zip"
  artifacts:
    paths:
      - dist/web/build/
    expire_in: 2 hours
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG && $EDGE_CLIENT_ID && $EDGE_API_KEY && $EDGE_PRODUCT_ID

# GitLab requires this job to be named exactly "pages" for Pages
pages:
  stage: publish
  needs:
    - job: build:web
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - mv dist/web/www public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

publish:release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    # --- Build artifacts ---
    - job: build:web
      artifacts: true
    - job: build:android
      artifacts: true
      optional: true
    - job: build:extFirefox
      artifacts: true
      optional: true
    - job: build:extChrome
      artifacts: true
      optional: true
    - job: build:iOS
      artifacts: true
      optional: true
    - job: build:x86_64:deb
      artifacts: true
      optional: true
    - job: build:x86_64:windows
      artifacts: true
      optional: true
    - job: build:arm64:deb
      artifacts: true
      optional: true
    - job: build:macOS:x86_64
      artifacts: true
      optional: true
    - job: build:macOS:arm64
      artifacts: true
      optional: true
    # --- Optional signed artifacts ---
    - job: publish:sign:extFirefox
      artifacts: true
      optional: true
    - job: publish:sign:extChrome
      artifacts: true
      optional: true
    - job: publish:sign:extEdge
      artifacts: true
      optional: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      RELEASE_DIR="release-artifacts"
      mkdir -p "${RELEASE_DIR}"

      echo "=== Inventorying release artifacts for v${TAG_VERSION} ==="

      # --- Collect file paths and compute checksums ---
      add_to_checksums() {
        local NAME="$1" FILEPATH="$2"
        HASH=$(sha256sum "${FILEPATH}" | awk '{print $1}')
        echo "${HASH}  ${NAME}" >> "${RELEASE_DIR}/SHA256SUMS"
        echo "${HASH}  ${NAME}" > "${RELEASE_DIR}/${NAME}.sha256"
        echo "${HASH}  ${NAME}"
      }

      # Web
      WEB_ZIP="dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-web.zip"
      [ -f "${WEB_ZIP}" ] && add_to_checksums "$(basename ${WEB_ZIP})" "${WEB_ZIP}"

      # Extensions
      for F in dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension*.zip \
               dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension*.xpi; do
        [ -f "${F}" ] && add_to_checksums "$(basename ${F})" "${F}"
      done

      # Android
      for F in dist/android/build/${PROJECT_NAME}-v${TAG_VERSION}-android*.apk; do
        [ -f "${F}" ] && add_to_checksums "$(basename ${F})" "${F}"
      done

      # iOS
      for F in dist/ios/build/${PROJECT_NAME}-v${TAG_VERSION}-ios*; do
        [ -f "${F}" ] && add_to_checksums "$(basename ${F})" "${F}"
      done

      # Desktop
      for F in dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}*; do
        case "${F}" in *.sha256) continue ;; esac
        [ -f "${F}" ] && add_to_checksums "$(basename ${F})" "${F}"
      done

      echo ""
      echo "=== SHA256SUMS ==="
      cat "${RELEASE_DIR}/SHA256SUMS" 2>/dev/null || echo "(no artifacts found)"

      # --- Build direct download links ---
      echo ""
      echo "=== Resolving job artifact URLs ==="

      API_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl -sf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${API_BASE}/pipelines/${CI_PIPELINE_ID}/jobs?per_page=100" || echo "[]")
      echo "Found $(echo ${JOBS_JSON} | jq length) jobs in pipeline"

      # Helper: get job ID by name (success status only)
      get_job_id() {
        echo "${JOBS_JSON}" | jq -r --arg name "$1" \
          '.[] | select(.name == $name and .status == "success") | .id' | head -1
      }

      # Helper: direct file download URL
      file_url() {
        echo "${CI_PROJECT_URL}/-/jobs/$1/artifacts/raw/$2"
      }

      ASSET_LINKS="[]"

      add_asset_link() {
        local NAME="$1" URL="$2" TYPE="${3:-other}"
        [ -z "${URL}" ] && return
        ASSET_LINKS=$(echo "${ASSET_LINKS}" | jq \
          --arg name "${NAME}" --arg url "${URL}" --arg type "${TYPE}" \
          '. + [{"name": $name, "url": $url, "link_type": $type}]')
        echo "  Link: ${NAME} → ${URL}"
      }

      # SHA256SUMS (from this job)
      add_asset_link "SHA256SUMS" \
        "$(file_url "${CI_JOB_ID}" "release-artifacts/SHA256SUMS")" "other"

      # --- Web ---
      JOB_ID=$(get_job_id "build:web")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-v${TAG_VERSION}-web.zip" \
          "$(file_url "${JOB_ID}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-web.zip")" "package"
      fi

      # --- Firefox extension (.xpi) ---
      # Prefer signed version if available
      JOB_ID=$(get_job_id "publish:sign:extFirefox")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi" \
          "$(file_url "${JOB_ID}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi")" "package"
      else
        JOB_ID=$(get_job_id "build:extFirefox")
        if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
          add_asset_link "${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi" \
            "$(file_url "${JOB_ID}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi")" "package"
        fi
      fi

      # --- Chrome extension (.zip) ---
      JOB_ID=$(get_job_id "build:extChrome")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-v${TAG_VERSION}-extension-chrome.zip" \
          "$(file_url "${JOB_ID}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-chrome.zip")" "package"
      fi

      # --- Edge extension (.zip) ---
      JOB_ID=$(get_job_id "build:extChrome")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-v${TAG_VERSION}-extension-edge.zip" \
          "$(file_url "${JOB_ID}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-edge.zip")" "package"
      fi

      # --- Android (.apk) ---
      JOB_ID=$(get_job_id "build:android")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        # Detect actual APK name (with or without -debug suffix)
        APK_NAME=$(ls dist/android/build/${PROJECT_NAME}-v${TAG_VERSION}-android*.apk 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
        if [ -n "${APK_NAME}" ]; then
          add_asset_link "${APK_NAME}" \
            "$(file_url "${JOB_ID}" "dist/android/build/${APK_NAME}")" "package"
        fi
      fi

      # --- iOS (.ipa) ---
      JOB_ID=$(get_job_id "build:iOS")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        if [ -f "dist/ios/build/${PROJECT_NAME}-v${TAG_VERSION}-ios.ipa" ]; then
          add_asset_link "${PROJECT_NAME}-v${TAG_VERSION}-ios.ipa" \
            "$(file_url "${JOB_ID}" "dist/ios/build/${PROJECT_NAME}-v${TAG_VERSION}-ios.ipa")" "package"
        elif [ -f "dist/ios/build/${PROJECT_NAME}-v${TAG_VERSION}-ios.zip" ]; then
          add_asset_link "${PROJECT_NAME}-v${TAG_VERSION}-ios.zip" \
            "$(file_url "${JOB_ID}" "dist/ios/build/${PROJECT_NAME}-v${TAG_VERSION}-ios.zip")" "package"
        fi
      fi

      # --- Linux x86_64 (.deb + .tar.gz) ---
      JOB_ID=$(get_job_id "build:x86_64:deb")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-x86_64.deb" \
          "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-x86_64.deb")" "package"
        add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-x86_64.tar.gz" \
          "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-x86_64.tar.gz")" "package"
      fi

      # --- Windows x86_64 (.exe + .zip) ---
      JOB_ID=$(get_job_id "build:x86_64:windows")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        if [ -f "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-windows-x86_64.exe" ]; then
          add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-windows-x86_64.exe" \
            "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-windows-x86_64.exe")" "package"
        fi
        add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-windows-x86_64.zip" \
          "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-windows-x86_64.zip")" "package"
      fi

      # --- macOS x86_64 (.zip) ---
      JOB_ID=$(get_job_id "build:macOS:x86_64")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-macos-x86_64.zip" \
          "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-macos-x86_64.zip")" "package"
      fi

      # --- macOS arm64 (.zip) ---
      JOB_ID=$(get_job_id "build:macOS:arm64")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-macos-arm64.zip" \
          "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-macos-arm64.zip")" "package"
      fi

      # --- Linux arm64 (.deb + .tar.gz) ---
      JOB_ID=$(get_job_id "build:arm64:deb")
      if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
        add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-arm64.deb" \
          "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-arm64.deb")" "package"
        add_asset_link "${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-arm64.tar.gz" \
          "$(file_url "${JOB_ID}" "dist/desktop/build/${PROJECT_NAME}-desktop-v${TAG_VERSION}-linux-arm64.tar.gz")" "package"
      fi

      echo ""
      echo "=== Asset links ==="
      echo "${ASSET_LINKS}" | jq .

      # --- Create GitLab release (delete existing if re-run) ---
      echo ""
      echo "=== Creating GitLab Release ==="

      # Delete pre-existing release for this tag (idempotent re-runs)
      curl -sf --request DELETE \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${API_BASE}/releases/${CI_COMMIT_TAG}" >/dev/null 2>&1 || true

      RELEASE_CMD="release-cli create"
      RELEASE_CMD="${RELEASE_CMD} --name 'Release ${CI_COMMIT_TAG}'"
      RELEASE_CMD="${RELEASE_CMD} --tag-name '${CI_COMMIT_TAG}'"
      RELEASE_CMD="${RELEASE_CMD} --description 'Release ${CI_COMMIT_TAG} - Built automatically by CI/CD pipeline. Download artifacts from the links below. Verify integrity with SHA256SUMS.'"

      LINK_COUNT=$(echo "${ASSET_LINKS}" | jq length)
      for i in $(seq 0 $((LINK_COUNT - 1))); do
        LINK_JSON=$(echo "${ASSET_LINKS}" | jq -c ".[$i]")
        RELEASE_CMD="${RELEASE_CMD} --assets-link '${LINK_JSON}'"
      done

      echo "Running: ${RELEASE_CMD}"
      eval ${RELEASE_CMD}
  artifacts:
    paths:
      - release-artifacts/
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_TAG
