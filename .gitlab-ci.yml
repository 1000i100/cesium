# ---------------------------------------------------------------
# Cesium CI/CD Pipeline — Refonte complète
# ---------------------------------------------------------------
# Stages: build → publish
#
# On develop/master: build:web → pages
# On tags:
#   build:web ──┬── build:extFirefox ────────────────────────────┐
#               ├── build:extChrome ─────────────────────────────┤
#               ├── build:android ───────────────────────────────┤
#               ├── build:iOS ───────────────────────────────────┤
#               ├── build:x86_64:deb ────────────────────────────┤
#               ├── build:x86_64:windows ────────────────────────┤
#               ├── build:arm64:deb ─────────────────────────────┤
#               ├── build:macOS:x86_64 ───────────────────────────┤
#               └── build:macOS:arm64 ───────────────────────────┤
#                                                                │
#                            pages (master) ─────────────────────┤
#                            publish:sign:extFirefox ─────────────┤
#                            publish:sign:extChrome ──────────────┤
#                            publish:sign:extEdge ────────────────┤
#                            publish:release ────────────────────┘
#
# Build jobs produce final artifacts (renamed with TAG_VERSION).
# Signed versions are attempted when secrets are available (allow_failure: true).
# ---------------------------------------------------------------

image: node:18

stages:
  - build
  - publish

# ---------------------------------------------------------------
# Global variables
# ---------------------------------------------------------------

variables:
  PROJECT_NAME: cesium
  RELEASE_VERSION: "${CI_COMMIT_TAG}"
  YARN_CACHE_FOLDER: "${CI_PROJECT_DIR}/.cache/yarn"
  NWJS_VERSION: "0.83.0"

# ---------------------------------------------------------------
# Templates réutilisables
# ---------------------------------------------------------------

.node_cache: &node_cache
  cache:
    key: node-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/yarn
      - node_modules/
    policy: pull-push

.rules_tag_only:
  rules:
    - if: $CI_COMMIT_TAG

.rules_web:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"

.desktop_base:
  stage: build
  needs:
    - job: build:web
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG


# ---------------------------------------------------------------
# Stage: build
# ---------------------------------------------------------------

build:web:
  stage: build
  <<: *node_cache
  extends:
    - .rules_web
  before_script:
    - yarn global add gulp
  script:
    - yarn install
    - yarn run build:web
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
        WEB_ZIP=$(find dist/web/build -name "${PROJECT_NAME}-v*-web.zip" 2>/dev/null | head -1 || true)
        [ -n "${WEB_ZIP}" ] && [ "${WEB_ZIP}" != "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-web.zip" ] && \
          cp "${WEB_ZIP}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-web.zip"
      fi
  after_script:
    - ls -la dist/web/ || true
    - du -csh dist/web/ || true
  artifacts:
    paths:
      - dist/web/
    expire_in: 2 hours

build:extFirefox:
  stage: build
  <<: *node_cache
  extends:
    - .rules_tag_only
  needs:
    - job: build:web
      artifacts: true
  before_script:
    - yarn global add gulp
    - yarn install
  script:
    - npx gulp webExtBuild --release
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      EXT_ZIP=$(find dist/web/build -name "${PROJECT_NAME}-v*-extension.zip" -not -name "*-chrome*" 2>/dev/null | head -1 || true)
      [ -n "${EXT_ZIP}" ] && cp "${EXT_ZIP}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-firefox.xpi"
  after_script:
    - ls -la dist/web/build/ || true
    - ls -la dist/web/ext/ || true
  artifacts:
    paths:
      - dist/web/build/
      - dist/web/ext/
    expire_in: 2 hours

build:extChrome:
  stage: build
  <<: *node_cache
  extends:
    - .rules_tag_only
  needs:
    - job: build:web
      artifacts: true
  before_script:
    - yarn global add gulp
    - yarn install
  script:
    - npx gulp chromeExtBuild --release
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      CHROME_ZIP=$(find dist/web/build -name "${PROJECT_NAME}-v*-extension-chrome.zip" 2>/dev/null | head -1 || true)
      [ -n "${CHROME_ZIP}" ] && cp "${CHROME_ZIP}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-chrome.zip"
      # Edge = même zip que Chrome (Manifest v3)
      [ -n "${CHROME_ZIP}" ] && cp "${CHROME_ZIP}" "dist/web/build/${PROJECT_NAME}-v${TAG_VERSION}-extension-edge.zip"
  after_script:
    - ls -la dist/web/build/ || true
  artifacts:
    paths:
      - dist/web/build/
    expire_in: 2 hours

build:android:
  stage: build
  image: thyrlian/android-sdk:9.3
  extends:
    - .rules_tag_only
  needs:
    - job: build:web
      artifacts: true
  variables:
    ANDROID_SDK_ROOT: /opt/android-sdk
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m"
    CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.7-all.zip"
  before_script:
    # Install Node.js 18
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
    - apt-get install -y nodejs
    # Install SDK components explicitly
    - sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
    # Install global tools (cordova directly, ionic CLI incompatible with ionic1)
    - npm install -g yarn gulp cordova
    # Install project deps
    - yarn install --ignore-engines
    # Copy web build into www (needed by cordova)
    - cp -r dist/web/www/* www/ || true
    # Add Android platform via cordova directly
    - cordova platform add android --confirm || true
  script:
    - cordova build android --release -- --packageType=apk
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      mkdir -p dist/android/build
      APK_FILE=$(find platforms/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1 || true)
      if [ -z "${APK_FILE}" ]; then
        echo "ERROR: No APK found after cordova build"
        exit 1
      fi
      echo "Found APK: ${APK_FILE}"

      # Find build-tools directory
      BUILD_TOOLS_DIR=$(find "${ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
      echo "Using build-tools: ${BUILD_TOOLS_DIR}"

      if [ -n "${CESIUM_KEYSTORE}" ] && [ -f "${CESIUM_KEYSTORE}" ]; then
        # --- Release signature with project keystore ---
        echo "Signing with release keystore"
        FINAL_APK="dist/android/build/${PROJECT_NAME}-v${TAG_VERSION}-android.apk"
        "${BUILD_TOOLS_DIR}/zipalign" -v 4 "${APK_FILE}" "${FINAL_APK}"
        KEY_ALIAS_VALUE="${KEY_ALIAS:-Cesium}"
        "${BUILD_TOOLS_DIR}/apksigner" sign \
          --ks "${CESIUM_KEYSTORE}" \
          --ks-pass "pass:${KEYSTORE_PWD}" \
          --ks-key-alias "${KEY_ALIAS_VALUE}" \
          "${FINAL_APK}"
      else
        # --- Debug signature (allows installation on any device) ---
        echo "No release keystore available — signing with generated debug key"
        DEBUG_KS="/tmp/debug.keystore"
        keytool -genkey -v \
          -keystore "${DEBUG_KS}" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Debug,O=Debug,C=US"
        FINAL_APK="dist/android/build/${PROJECT_NAME}-v${TAG_VERSION}-android-debug.apk"
        "${BUILD_TOOLS_DIR}/zipalign" -v 4 "${APK_FILE}" "${FINAL_APK}"
        "${BUILD_TOOLS_DIR}/apksigner" sign \
          --ks "${DEBUG_KS}" \
          --ks-pass pass:android \
          --ks-key-alias androiddebugkey \
          "${FINAL_APK}"
      fi

      # Verify signature
      "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "${FINAL_APK}"
      echo "Successfully signed APK: ${FINAL_APK}"
  after_script:
    - ls -la dist/android/build/ || true
  artifacts:
    paths:
      - dist/android/build/
    expire_in: 2 hours

build:iOS:
  stage: build
  extends:
    - .rules_tag_only
  allow_failure: true
  tags:
    - macos
    - ios
  needs:
    - job: build:web
      artifacts: true
  before_script:
    # Load nvm if available (shell runner on macOS may not have node in PATH)
    - 'export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true'
    - 'command -v node >/dev/null || (echo "ERROR: node not found. Install Node.js or nvm on this runner." && exit 1)'
    - npm install -g yarn gulp cordova
    - yarn install --ignore-engines
    # Copy web build into www
    - cp -r dist/web/www/* www/ || true
    - cordova platform add ios --confirm || true
  script:
    - 'export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true'
    - cordova build ios --release || cordova build ios
    - |
      CURRENT_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      mkdir -p dist/ios/build
      # Copy IPA or app bundle
      IPA=$(find platforms/ios/build -name "*.ipa" 2>/dev/null | head -1)
      if [ -n "${IPA}" ]; then
        cp "${IPA}" "dist/ios/build/${PROJECT_NAME}-v${CURRENT_VERSION}-ios.ipa"
      else
        # Fallback: zip the .app bundle
        APP_DIR=$(find platforms/ios/build -name "*.app" -type d 2>/dev/null | head -1)
        if [ -n "${APP_DIR}" ]; then
          cd "$(dirname "${APP_DIR}")"
          zip -r "${CI_PROJECT_DIR}/dist/ios/build/${PROJECT_NAME}-v${CURRENT_VERSION}-ios.zip" "$(basename "${APP_DIR}")"
          cd "${CI_PROJECT_DIR}"
        fi
      fi
  after_script:
    - ls -la dist/ios/build/ || true
  artifacts:
    paths:
      - dist/ios/build/
    expire_in: 2 hours

build:x86_64:deb:
  extends:
    - .desktop_base
  image: debian:bookworm
  before_script:
    - apt-get update && apt-get install -y curl wget xz-utils zip unzip fakeroot dpkg-dev imagemagick desktop-file-utils git npm
    # Init desktop submodule
    # Force HTTPS for submodules (SSH keys not available in CI)
    - git config --global url."https://git.duniter.org/".insteadOf "git@git.duniter.org:"
    - git submodule init || true
    - git submodule sync || true
    # Clean submodule dirs (gitlink from checkout blocks clone)
    - rm -rf dist/desktop dist/android/sources
    - git submodule update --remote --merge || true
    - CURRENT_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
    - echo "VERSION=${CURRENT_VERSION}"
  script:
    - |
      set -e
      ARCH="x64"
      NWJS_DIR="nwjs-v${NWJS_VERSION}-linux-${ARCH}"
      BUILD_DIR="dist/desktop/build"
      WORK_DIR="$(pwd)/desktop-work"
      mkdir -p "${BUILD_DIR}" "${WORK_DIR}"

      echo "=== Downloading NW.js v${NWJS_VERSION} linux-${ARCH} ==="
      cd "${WORK_DIR}"
      wget -q "https://dl.nwjs.io/v${NWJS_VERSION}/${NWJS_DIR}.tar.gz"
      tar xzf "${NWJS_DIR}.tar.gz"

      echo "=== Preparing desktop application ==="
      APP_DIR="${WORK_DIR}/${NWJS_DIR}"

      # Copy web files (desktop code expects "cesium/" not "www/")
      mkdir -p "${APP_DIR}/cesium"
      cp -r "${CI_PROJECT_DIR}/dist/web/www/"* "${APP_DIR}/cesium/"

      # Copy desktop files
      DESKTOP_SRC="${CI_PROJECT_DIR}/dist/desktop/src"
      if [ -d "${DESKTOP_SRC}" ]; then
        cp "${DESKTOP_SRC}/cesium-desktop.js" "${APP_DIR}/"
        cp "${DESKTOP_SRC}/splash.html" "${APP_DIR}/"
        cp "${DESKTOP_SRC}/package.json" "${APP_DIR}/"
        [ -f "${DESKTOP_SRC}/package-lock.json" ] && cp "${DESKTOP_SRC}/package-lock.json" "${APP_DIR}/"
      fi

      # Inject cesium-desktop.js into index.html
      sed -i 's|<script src="config.js"></script>|<script src="config.js"></script>\n    <script src="../cesium-desktop.js"></script>|' "${APP_DIR}/cesium/index.html"

      # Install desktop node dependencies
      cd "${APP_DIR}"
      npm install --production 2>/dev/null || true
      cd "${WORK_DIR}"

      echo "=== Creating .tar.gz ==="
      TARBALL="${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-linux-x86_64.tar.gz"
      tar czf "${CI_PROJECT_DIR}/${BUILD_DIR}/${TARBALL}" -C "${WORK_DIR}" "${NWJS_DIR}"
      echo "Created: ${TARBALL}"

      echo "=== Creating .deb package ==="
      DEB_ROOT="${WORK_DIR}/deb-root"
      mkdir -p "${DEB_ROOT}/opt/cesium"

      # Copy NW.js + app directly into /opt/cesium (no nw.nwb compression)
      cp -r "${APP_DIR}/"* "${DEB_ROOT}/opt/cesium/"
      chmod a+x "${DEB_ROOT}/opt/cesium/nw"

      # Copy package structure from submodule (usr/share/*, etc.) but NOT DEBIAN/
      PKG_SRC="${CI_PROJECT_DIR}/dist/desktop/arch/linux/package"
      if [ -d "${PKG_SRC}/usr" ]; then
        cp -r "${PKG_SRC}/usr" "${DEB_ROOT}/"
      fi

      # Generate our own DEBIAN/ control files (submodule ones are outdated)
      mkdir -p "${DEB_ROOT}/DEBIAN"
      INSTALLED_SIZE=$(du -sk "${DEB_ROOT}" | awk '{print $1}')
      printf '%s\n' \
        "Package: cesium-desktop" \
        "Version: ${CURRENT_VERSION}" \
        "Architecture: amd64" \
        "Maintainer: Duniter Team <contact@duniter.org>" \
        "Installed-Size: ${INSTALLED_SIZE}" \
        "Depends: libnss3 (>= 3.26), libatk-bridge2.0-0, libatomic1, libgtk-3-0" \
        "Conflicts: cesium-desktop" \
        "Replaces: cesium-desktop" \
        "Provides: cesium-desktop" \
        "Section: contrib/misc" \
        "Priority: optional" \
        "Homepage: https://www.cesium.app" \
        "Description: Cesium Wallet for G1 currency" \
        " Cesium is a wallet (client-software) for G1 a libre currency." \
        " Please visit https://www.duniter.org for more information." \
        " License AGPL-3" \
        > "${DEB_ROOT}/DEBIAN/control"

      printf '#!/bin/bash\nln -sf /opt/cesium/nw /usr/bin/cesium\nchmod a+rX -R /opt/cesium\n' \
        > "${DEB_ROOT}/DEBIAN/postinst"
      chmod 755 "${DEB_ROOT}/DEBIAN/postinst"

      printf '#!/bin/bash\n[ -L /usr/bin/cesium ] && rm -f /usr/bin/cesium\n' \
        > "${DEB_ROOT}/DEBIAN/prerm"
      chmod 755 "${DEB_ROOT}/DEBIAN/prerm"

      # Gzip changelog if present
      [ -f "${DEB_ROOT}/usr/share/doc/cesium-desktop/changelog.Debian" ] && \
        gzip -9 "${DEB_ROOT}/usr/share/doc/cesium-desktop/changelog.Debian" 2>/dev/null || true

      # Copy icon
      ICON_SRC="${CI_PROJECT_DIR}/resources/icon.png"
      if [ -f "${ICON_SRC}" ]; then
        mkdir -p "${DEB_ROOT}/usr/share/pixmaps"
        cp "${ICON_SRC}" "${DEB_ROOT}/usr/share/pixmaps/cesium.png"
      fi

      # Build .deb
      DEB_FILE="${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-linux-x86_64.deb"
      fakeroot dpkg-deb --build "${DEB_ROOT}" "${CI_PROJECT_DIR}/${BUILD_DIR}/${DEB_FILE}"
      echo "Created: ${DEB_FILE}"

      echo "=== Attempting .AppImage (best-effort) ==="
      # AppImage requires FUSE which may not be available in Docker
      if command -v pkg2appimage >/dev/null 2>&1; then
        APPIMAGE_YML="${CI_PROJECT_DIR}/dist/desktop/arch/linux/appimage.yml"
        if [ -f "${APPIMAGE_YML}" ]; then
          pkg2appimage "${APPIMAGE_YML}" || echo "WARN: AppImage build failed (FUSE likely unavailable in container)"
          APPIMAGE_FILE=$(find . -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "${APPIMAGE_FILE}" ]; then
            cp "${APPIMAGE_FILE}" "${CI_PROJECT_DIR}/${BUILD_DIR}/${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-linux-x86_64.AppImage"
            echo "Created: AppImage"
          fi
        fi
      else
        echo "WARN: pkg2appimage not found, skipping AppImage build"
      fi

      echo "=== Generating SHA256 checksums ==="
      cd "${CI_PROJECT_DIR}/${BUILD_DIR}"
      for f in *; do
        case "$f" in *.sha256) continue ;; esac
        [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
      done

      echo "=== Build complete ==="
      ls -la "${CI_PROJECT_DIR}/${BUILD_DIR}/"
  artifacts:
    paths:
      - dist/desktop/build/
    expire_in: 2 hours

build:x86_64:windows:
  extends:
    - .desktop_base
  image: debian:bookworm
  before_script:
    - apt-get update && apt-get install -y curl wget xz-utils zip unzip p7zip-full wine64 git npm
    # Init desktop submodule
    # Force HTTPS for submodules (SSH keys not available in CI)
    - git config --global url."https://git.duniter.org/".insteadOf "git@git.duniter.org:"
    - git submodule init || true
    - git submodule sync || true
    # Clean submodule dirs (gitlink from checkout blocks clone)
    - rm -rf dist/desktop dist/android/sources
    - git submodule update --remote --merge || true
    - CURRENT_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
    - echo "VERSION=${CURRENT_VERSION}"
  script:
    - |
      set -e
      NWJS_DIR="nwjs-v${NWJS_VERSION}-win-x64"
      BUILD_DIR="dist/desktop/build"
      WORK_DIR="$(pwd)/desktop-work"
      mkdir -p "${BUILD_DIR}" "${WORK_DIR}"

      echo "=== Downloading NW.js v${NWJS_VERSION} win-x64 ==="
      cd "${WORK_DIR}"
      wget -q "https://dl.nwjs.io/v${NWJS_VERSION}/${NWJS_DIR}.zip"
      7z x -y "${NWJS_DIR}.zip" >/dev/null

      echo "=== Preparing desktop application ==="
      APP_DIR="${WORK_DIR}/${NWJS_DIR}"

      # Copy web files (desktop code expects "cesium/" not "www/")
      mkdir -p "${APP_DIR}/cesium"
      cp -r "${CI_PROJECT_DIR}/dist/web/www/"* "${APP_DIR}/cesium/"

      # Copy desktop files
      DESKTOP_SRC="${CI_PROJECT_DIR}/dist/desktop/src"
      if [ -d "${DESKTOP_SRC}" ]; then
        cp "${DESKTOP_SRC}/cesium-desktop.js" "${APP_DIR}/"
        cp "${DESKTOP_SRC}/splash.html" "${APP_DIR}/"
        cp "${DESKTOP_SRC}/package.json" "${APP_DIR}/"
        [ -f "${DESKTOP_SRC}/package-lock.json" ] && cp "${DESKTOP_SRC}/package-lock.json" "${APP_DIR}/"
      fi

      # Inject cesium-desktop.js into index.html
      sed -i 's|<script src="config.js"></script>|<script src="config.js"></script>\n    <script src="../cesium-desktop.js"></script>|' "${APP_DIR}/cesium/index.html"

      # Install desktop node dependencies
      cd "${APP_DIR}"
      npm install --production 2>/dev/null || true
      cd "${WORK_DIR}"

      echo "=== Attempting Inno Setup via Wine (best-effort) ==="
      INNO_SETUP_OK=false

      # Try to install Inno Setup 5 under Wine
      if command -v wine64 >/dev/null 2>&1; then
        export WINEDEBUG=-all
        export WINEPREFIX="${WORK_DIR}/.wine"
        mkdir -p "${WINEPREFIX}"

        # Download Inno Setup 5
        INNO_URL="https://files.jrsoftware.org/is/5/innosetup-5.5.9-unicode.exe"
        wget -q "${INNO_URL}" -O innosetup.exe 2>/dev/null || true

        if [ -f "innosetup.exe" ]; then
          # Silent install
          wine64 innosetup.exe /VERYSILENT /DIR="C:\\InnoSetup" 2>/dev/null || true
          ISCC="${WINEPREFIX}/drive_c/InnoSetup/ISCC.exe"

          if [ -f "${ISCC}" ]; then
            # Prepare Inno Setup script
            ISS_FILE="${CI_PROJECT_DIR}/dist/desktop/arch/windows/cesium.iss"
            if [ -f "${ISS_FILE}" ]; then
              # Update version in .iss file
              cp "${ISS_FILE}" "${WORK_DIR}/cesium.iss"
              sed -i "s/#define MyAppVersion.*/#define MyAppVersion \"v${CURRENT_VERSION}\"/" "${WORK_DIR}/cesium.iss"

              # Run Inno Setup compiler
              cd "${WORK_DIR}"
              wine64 "${ISCC}" "cesium.iss" "/DROOT_PATH=$(winepath -w "${APP_DIR}")" 2>/dev/null && INNO_SETUP_OK=true || true
            fi
          fi
        fi
      fi

      if [ "${INNO_SETUP_OK}" = true ]; then
        # Find the generated .exe
        EXE_FILE=$(find "${WORK_DIR}" -name "*.exe" -not -name "innosetup.exe" -not -name "ISCC.exe" 2>/dev/null | head -1)
        if [ -n "${EXE_FILE}" ]; then
          cp "${EXE_FILE}" "${CI_PROJECT_DIR}/${BUILD_DIR}/${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-windows-x86_64.exe"
          echo "Created installer: ${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-windows-x86_64.exe"
        fi
      fi

      # Always create a .zip fallback
      echo "=== Creating .zip fallback ==="
      cd "${WORK_DIR}"
      ZIP_FILE="${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-windows-x86_64.zip"
      zip -qr "${CI_PROJECT_DIR}/${BUILD_DIR}/${ZIP_FILE}" "${NWJS_DIR}"
      echo "Created: ${ZIP_FILE}"

      echo "=== Generating SHA256 checksums ==="
      cd "${CI_PROJECT_DIR}/${BUILD_DIR}"
      for f in *; do
        case "$f" in *.sha256) continue ;; esac
        [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
      done

      echo "=== Build complete ==="
      ls -la "${CI_PROJECT_DIR}/${BUILD_DIR}/"
  artifacts:
    paths:
      - dist/desktop/build/
    expire_in: 2 hours

build:arm64:deb:
  extends:
    - .desktop_base
  allow_failure: true
  image: debian:bookworm
  tags:
    - dockerARM
  before_script:
    - apt-get update && apt-get install -y curl wget xz-utils zip unzip fakeroot dpkg-dev git npm
    # Init desktop submodule
    # Force HTTPS for submodules (SSH keys not available in CI)
    - git config --global url."https://git.duniter.org/".insteadOf "git@git.duniter.org:"
    - git submodule init || true
    - git submodule sync || true
    # Clean submodule dirs (gitlink from checkout blocks clone)
    - rm -rf dist/desktop dist/android/sources
    - git submodule update --remote --merge || true
    - CURRENT_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
    - echo "VERSION=${CURRENT_VERSION}"
  script:
    - |
      set -e
      # WARNING: NW.js does NOT have official ARM64 builds.
      # This job is experimental and will likely fail at the download step.
      ARCH="arm64"
      NWJS_DIR="nwjs-v${NWJS_VERSION}-linux-${ARCH}"
      BUILD_DIR="dist/desktop/build"
      WORK_DIR="$(pwd)/desktop-work"
      mkdir -p "${BUILD_DIR}" "${WORK_DIR}"

      echo "=== Downloading NW.js v${NWJS_VERSION} linux-${ARCH} (experimental) ==="
      cd "${WORK_DIR}"

      # Try official download first, then community builds
      wget -q "https://dl.nwjs.io/v${NWJS_VERSION}/${NWJS_DIR}.tar.gz" || {
        echo "WARN: No official NW.js ARM64 build available"
        echo "Trying unofficial/community builds..."
        wget -q "https://github.com/nicedoc/nwjs-arm64/releases/download/v${NWJS_VERSION}/${NWJS_DIR}.tar.gz" || {
          echo "ERROR: No NW.js ARM64 build found. This job is experimental."
          exit 1
        }
      }

      tar xzf "${NWJS_DIR}.tar.gz"

      echo "=== Preparing desktop application ==="
      APP_DIR="${WORK_DIR}/${NWJS_DIR}"

      # Copy web files (desktop code expects "cesium/" not "www/")
      mkdir -p "${APP_DIR}/cesium"
      cp -r "${CI_PROJECT_DIR}/dist/web/www/"* "${APP_DIR}/cesium/"

      # Copy desktop files
      DESKTOP_SRC="${CI_PROJECT_DIR}/dist/desktop/src"
      if [ -d "${DESKTOP_SRC}" ]; then
        cp "${DESKTOP_SRC}/cesium-desktop.js" "${APP_DIR}/"
        cp "${DESKTOP_SRC}/splash.html" "${APP_DIR}/"
        cp "${DESKTOP_SRC}/package.json" "${APP_DIR}/"
        [ -f "${DESKTOP_SRC}/package-lock.json" ] && cp "${DESKTOP_SRC}/package-lock.json" "${APP_DIR}/"
      fi

      # Inject cesium-desktop.js into index.html
      sed -i 's|<script src="config.js"></script>|<script src="config.js"></script>\n    <script src="../cesium-desktop.js"></script>|' "${APP_DIR}/cesium/index.html"

      # Install desktop node dependencies
      cd "${APP_DIR}"
      npm install --production 2>/dev/null || true
      cd "${WORK_DIR}"

      echo "=== Creating .tar.gz ==="
      TARBALL="${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-linux-arm64.tar.gz"
      tar czf "${CI_PROJECT_DIR}/${BUILD_DIR}/${TARBALL}" -C "${WORK_DIR}" "${NWJS_DIR}"
      echo "Created: ${TARBALL}"

      echo "=== Creating .deb package ==="
      DEB_ROOT="${WORK_DIR}/deb-root"
      mkdir -p "${DEB_ROOT}/opt/cesium"

      # Copy NW.js + app directly into /opt/cesium (no nw.nwb compression)
      cp -r "${APP_DIR}/"* "${DEB_ROOT}/opt/cesium/"
      chmod a+x "${DEB_ROOT}/opt/cesium/nw"

      # Copy package structure from submodule (usr/share/*, etc.) but NOT DEBIAN/
      PKG_SRC="${CI_PROJECT_DIR}/dist/desktop/arch/linux/package"
      if [ -d "${PKG_SRC}/usr" ]; then
        cp -r "${PKG_SRC}/usr" "${DEB_ROOT}/"
      fi

      # Generate our own DEBIAN/ control files
      mkdir -p "${DEB_ROOT}/DEBIAN"
      INSTALLED_SIZE=$(du -sk "${DEB_ROOT}" | awk '{print $1}')
      printf '%s\n' \
        "Package: cesium-desktop" \
        "Version: ${CURRENT_VERSION}" \
        "Architecture: arm64" \
        "Maintainer: Duniter Team <contact@duniter.org>" \
        "Installed-Size: ${INSTALLED_SIZE}" \
        "Depends: libnss3 (>= 3.26), libatk-bridge2.0-0, libatomic1, libgtk-3-0" \
        "Conflicts: cesium-desktop" \
        "Replaces: cesium-desktop" \
        "Provides: cesium-desktop" \
        "Section: contrib/misc" \
        "Priority: optional" \
        "Homepage: https://www.cesium.app" \
        "Description: Cesium Wallet for G1 currency" \
        " Cesium is a wallet (client-software) for G1 a libre currency." \
        " Please visit https://www.duniter.org for more information." \
        " License AGPL-3" \
        > "${DEB_ROOT}/DEBIAN/control"

      printf '#!/bin/bash\nln -sf /opt/cesium/nw /usr/bin/cesium\nchmod a+rX -R /opt/cesium\n' \
        > "${DEB_ROOT}/DEBIAN/postinst"
      chmod 755 "${DEB_ROOT}/DEBIAN/postinst"

      printf '#!/bin/bash\n[ -L /usr/bin/cesium ] && rm -f /usr/bin/cesium\n' \
        > "${DEB_ROOT}/DEBIAN/prerm"
      chmod 755 "${DEB_ROOT}/DEBIAN/prerm"

      # Gzip changelog if present
      [ -f "${DEB_ROOT}/usr/share/doc/cesium-desktop/changelog.Debian" ] && \
        gzip -9 "${DEB_ROOT}/usr/share/doc/cesium-desktop/changelog.Debian" 2>/dev/null || true

      # Copy icon
      ICON_SRC="${CI_PROJECT_DIR}/resources/icon.png"
      if [ -f "${ICON_SRC}" ]; then
        mkdir -p "${DEB_ROOT}/usr/share/pixmaps"
        cp "${ICON_SRC}" "${DEB_ROOT}/usr/share/pixmaps/cesium.png"
      fi

      DEB_FILE="${PROJECT_NAME}-desktop-v${CURRENT_VERSION}-linux-arm64.deb"
      fakeroot dpkg-deb --build "${DEB_ROOT}" "${CI_PROJECT_DIR}/${BUILD_DIR}/${DEB_FILE}"
      echo "Created: ${DEB_FILE}"

      echo "=== Generating SHA256 checksums ==="
      cd "${CI_PROJECT_DIR}/${BUILD_DIR}"
      for f in *; do
        case "$f" in *.sha256) continue ;; esac
        [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
      done

      echo "=== Build complete ==="
      ls -la "${CI_PROJECT_DIR}/${BUILD_DIR}/"
  artifacts:
    paths:
      - dist/desktop/build/
    expire_in: 2 hours

build:macOS:x86_64:
  extends:
    - .desktop_base
  tags:
    - macos
  before_script:
    # Init desktop submodule
